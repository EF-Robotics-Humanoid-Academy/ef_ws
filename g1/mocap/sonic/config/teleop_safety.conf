# =============================================================================
# SONIC / G1 full-body mocap teleoperation — safety & smoothing parameters
# =============================================================================
# Loaded by:  bin/g1_deploy_onnx_ref --teleop-safety-config config/teleop_safety.conf
# Launcher:   ./teleop_safe.sh {selftest|dry-run|real}
# Override one value from the command line:  --set key=value  (launcher)
#                                             --safety-set key=value (binary)
#
# Format: key = value, '#' starts a comment. Unknown keys or bad values abort
# startup; every value is range-checked (limits shown as [min, max]).
# Changing this file invalidates the dry-run validation stamp, so
# './teleop_safe.sh real' will refuse to start until the selftest passes again.
#
# How it works
#   The mocap stream is a REFERENCE that the SONIC policy tracks; the policy
#   keeps the robot balanced. Smoothing and speed limits act on that reference
#   (per joint, IsaacLab order), never by throttling the balance policy. Motor
#   targets from the policy only pass a URDF position clamp, a NaN check and a
#   large-jump guard.
#
# Effective per-joint reference velocity limit:
#   vmax = min(max_velocity_fraction * URDF_velocity, max_step_per_cycle_rad * 50 Hz)
# With the defaults below, vmax = 2.0 rad/s on every joint: the per-cycle step
# is the binding limit (25% of URDF limits would be 5.0-9.25 rad/s).
# Effective per-joint reference acceleration limit:
#   amax = max_acceleration_fraction * nominal_acceleration_limit = 12 rad/s^2
# =============================================================================

# Control loop rate of the SONIC controller. Fixed by the policy; must be 50.
control_rate_hz = 50                    # [50, 50]

# ---- Reference shaping -------------------------------------------------------
# Critically damped low-pass time constant on mocap joint targets (ms).
smoothing_time_ms = 200                 # [0, 1000]   recommended 150-250
# Max reference joint velocity as a fraction of the URDF velocity limit.
max_velocity_fraction = 0.25            # [0.01, 1.0] recommended 0.20-0.30
# Max reference joint acceleration as a fraction of nominal_acceleration_limit.
max_acceleration_fraction = 0.15        # [0.01, 1.0] recommended 0.10-0.20
# ASSUMPTION: the G1 URDF has no acceleration limits. This is the "normal"
# acceleration (rad/s^2) that max_acceleration_fraction is applied to.
nominal_acceleration_limit = 80         # [1, 500]
# Hard cap on reference position change per 20 ms control cycle (rad).
max_step_per_cycle_rad = 0.04           # [0.001, 0.2]  0.04 rad/cycle = 2 rad/s
# Keep reference targets this far inside the URDF position limits (rad).
reference_limit_margin_rad = 0.05       # [0, 0.3]
# Frames with any joint further than this beyond URDF limits are rejected
# as invalid (rad). Closer violations are clamped instead.
invalid_frame_tolerance_rad = 0.30      # [0, 1.0]
# Root (pelvis) orientation reference: smoothing and max angular rate.
root_smoothing_time_ms = 200            # [0, 1000]
max_root_angular_velocity = 0.6         # [0.05, 6] rad/s

# ---- Startup ---------------------------------------------------------------
# Ramp from the current reference (initialised from the MEASURED joint
# positions) to the mocap target each time following (re)starts (s).
startup_ramp_s = 4.0                    # [0.5, 30]   recommended 3-5
# Launch ramp from measured pose to the standing pose after ENABLE (s).
# Cannot be faster than the original 3 s.
init_ramp_s = 5.0                       # [3, 30]

# ---- Timeouts / dead-man / watchdog ----------------------------------------
# No valid mocap frame for this long -> decelerate and HOLD the last safe target.
mocap_timeout_ms = 200                  # [20, 1000]
# Dead-man = SPACE held in the controller terminal (keyboard auto-repeat).
# Released longer than this -> decelerate and HOLD. Must exceed the terminal's
# auto-repeat delay (typically 250-660 ms) or holding the key will flicker.
deadman_timeout_ms = 700                # [100, 2000]
# Command watchdog in the 500 Hz writer: motor command older than this means
# the control loop failed -> latch damping (kp=0, kd=8), same as emergency stop.
command_watchdog_ms = 100               # [40, 500]
# Policy motor-target jump guard per 20 ms cycle (rad). Fault guard only;
# set generously so it never fights normal balance corrections.
output_max_step_rad = 0.35              # [0.02, 1.0]

# ---- Motor temperature (max of winding/driver over all 29 motors, C) --------
# Upper bounds are capped at the controller's existing 90 C alarm.
temperature_reduce_c = 70               # [30, 90]  scale vel/acc limits down
temperature_reduce_factor = 0.5         # [0.1, 1.0]
temperature_stop_c = 85                 # [35, 90]  stop following, HOLD pose
temperature_hysteresis_c = 5            # [1, 20]

# ---- Logging -----------------------------------------------------------------
log_interval_s = 1.0                    # [0.1, 60] min interval per warning type
status_interval_s = 1.0                 # [0.1, 60] one-line status cadence
loop_overrun_factor = 1.5               # [1.1, 10] period > factor*20 ms = overrun
# Per-tick CSV (raw/ref/vel/motor targets). Empty = off. The launcher sets it.
csv_log_path =

# ---- Dry-run only --------------------------------------------------------------
# Motor temperature reported by the synthetic robot state.
dry_run_synthetic_temperature_c = 40    # [0, 120]
# Synthetic joints: 0 = held still at the standing pose (default), >0 = follow
# the motor targets with this first-order lag (ms). Neither has real dynamics.
dry_run_synthetic_joint_lag_ms = 0      # [0, 1000]
# Fault injection for the selftest: stall the control loop once, N s after
# control starts, to prove the watchdog trips. Ignored unless --dry-run. 0 = off.
dry_run_inject_stall_after_s = 0        # [0, 3600]
